<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유진소닉 화주사별 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="loader" class="loader-container"><div class="spinner"></div><p>ERP 동기화 중...</p></div>
  
  <div class="app-wrapper" style="display: none;" id="app">
    <div class="main-content">
      <header class="top-header">
        <div class="page-title">경영관리 화주사별 대시보드</div>
        <button class="btn-refresh" onclick="fetchData()">데이터 새로고침</button>
      </header>

      <!-- 상단 기간 및 조직 필터 -->
      <div class="filter-bar">
        <div class="filter-group"><label>연도</label><select id="f-year"></select></div>
        <div class="filter-group"><label>월</label><select id="f-month"></select></div>
        <div class="filter-group"><label>본부</label><select id="f-hq"></select></div>
        <div class="filter-group"><label>팀</label><select id="f-team"></select></div>
      </div>

      <!-- 화주사 카드가 배열될 영역 -->
      <div class="scroll-area">
        <div id="card-container" class="card-grid">
          <!-- 스크립트에서 카드가 자동 생성됩니다 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 화주사 카드 클릭 시 뜨는 상세 팝업(Modal) -->
  <div id="detail-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-header">
        <h2 id="modal-title">화주사 상세 리포트</h2>
        <span id="modal-subtitle" class="modal-subtitle"></span>
      </div>
      
      <div class="kpi-grid" style="margin-top: 20px;">
        <div class="kpi-card"><h3>총 매출</h3><p id="m-kpi-rev">-</p><div class="yoy-badge" id="m-kpi-yoy-rev">-</div></div>
        <div class="kpi-card highlight-card"><h3>공헌이익</h3><p id="m-kpi-cm">-</p><div class="sub-kpi">이익률: <b id="m-kpi-cm-ratio">-</b></div></div>
        <div class="kpi-card highlight-card"><h3>매출이익</h3><p id="m-kpi-gp">-</p><div class="yoy-badge" id="m-kpi-yoy-gp" style="margin-top: 5px;">-</div><div class="sub-kpi">이익률: <b id="m-kpi-gp-ratio">-</b></div></div>
      </div>
      
      <div class="chart-layout" style="margin-top: 20px;">
        <div class="chart-box large-chart">
          <div class="box-header"><h4>월별 이익 구조 추이</h4></div>
          <canvas id="modal-chart-trend"></canvas>
        </div>
        <div class="chart-box large-chart">
          <div class="box-header"><h4>전년 동기 매출 비교</h4></div>
          <canvas id="modal-chart-yoy"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js?v=3" defer></script>
</body>
</html>
