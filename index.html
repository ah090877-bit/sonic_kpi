<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유진소닉 경영관리 대시보드</title>
  
  <!-- 차트 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- CSS 디자인 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" class="loader-container">
    <div class="spinner"></div>
    <p>ERP 데이터를 동기화 중입니다...</p>
  </div>
  
  <div class="app-container" style="display: none;" id="app">
    <header class="top-header">
      <div class="logo">YUJIN SONIC <span>경영관리 대시보드</span></div>
      <button class="btn-refresh" onclick="fetchData()">데이터 새로고침</button>
    </header>

    <div class="filter-bar">
      <div class="filter-group"><label>연도</label><select id="f-year"></select></div>
      <div class="filter-group"><label>월</label><select id="f-month"></select></div>
      <div class="filter-group"><label>본부</label><select id="f-hq"></select></div>
      <div class="filter-group"><label>팀(사업소)</label><select id="f-team"></select></div>
      <div class="filter-group"><label>구분</label><select id="f-isnew"></select></div>
      <div class="filter-group"><label>화주사</label><select id="f-client"></select></div>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-target="tab-main">메인 대시보드</button>
      <button class="tab-btn" data-target="tab-detail">세부 실적 리포트</button>
    </nav>

    <main id="tab-main" class="tab-content active">
      <div class="kpi-grid">
        <div class="kpi-card"><h3>총매출</h3><p id="kpi-rev" class="kpi-val">-</p></div>
        <div class="kpi-card"><h3>기존 매출</h3><p id="kpi-exist" class="kpi-val">-</p></div>
        <div class="kpi-card"><h3>신규 매출</h3><p id="kpi-new" class="kpi-val">-</p></div>
        <div class="kpi-card"><h3>총비용</h3><p id="kpi-cost" class="kpi-val">-</p></div>
        <div class="kpi-card"><h3>손익</h3><p id="kpi-profit" class="kpi-val">-</p></div>
        <div class="kpi-card highlight"><h3>이익률</h3><p id="kpi-margin" class="kpi-val">-</p></div>
        <div class="kpi-card highlight"><h3>전년비 성장률</h3><p id="kpi-yoy" class="kpi-val">-</p></div>
      </div>
      
      <div class="chart-grid">
        <div class="chart-box"><h4>월별 매출 및 손익 추이</h4><canvas id="chart-monthly-trend"></canvas></div>
        <div class="chart-box"><h4>기존 vs 신규 비중 추이</h4><canvas id="chart-new-exist"></canvas></div>
        <div class="chart-box"><h4>본부별 매출 비중</h4><canvas id="chart-hq-share"></canvas></div>
        <div class="chart-box"><h4>팀별 실적 비교</h4><canvas id="chart-team-comp"></canvas></div>
      </div>
    </main>

    <main id="tab-detail" class="tab-content">
      <div class="table-container">
        <table class="data-table" id="detail-table">
          <thead>
            <tr><th>연도-월</th><th>본부</th><th>팀</th><th>화주사</th><th>거래단위</th><th>구분</th><th>매출(백만)</th><th>비용(백만)</th><th>손익(백만)</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- JavaScript 기능 파일 연결 (화면이 다 그려진 후 실행되도록 defer 속성 추가) -->
  <script src="script.js" defer></script>
</body>
</html>
