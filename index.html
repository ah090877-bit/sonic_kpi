<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EUGENE SONIC Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" class="loader-container"><div class="spinner"></div></div>
  
  <div class="app-wrapper" style="display: none;" id="app">
    <!-- 좌측 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>EUGENE</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="tab-btn active" data-target="tab-main">📊 DASHBOARD</button>
        <button class="tab-btn" data-target="tab-detail">📑 REPORTS</button>
      </nav>
    </aside>

    <!-- 우측 메인 영역 -->
    <div class="main-content">
      <!-- 상단 헤더 -->
      <header class="top-header">
        <div class="page-title">경영관리 대시보드</div>
        <div class="header-right">
          <button class="btn-refresh" onclick="fetchData()">Data Sync</button>
        </div>
      </header>

      <!-- 필터 영역 -->
      <div class="filter-bar">
        <div class="filter-group"><label>연도</label><select id="f-year"></select></div>
        <div class="filter-group"><label>월</label><select id="f-month"></select></div>
        <div class="filter-group"><label>본부</label><select id="f-hq"></select></div>
        <div class="filter-group"><label>팀</label><select id="f-team"></select></div>
        <div class="filter-group"><label>구분</label><select id="f-isnew"></select></div>
        <div class="filter-group"><label>화주사</label><select id="f-client"></select></div>
      </div>

      <div class="scroll-area">
        <!-- 탭 1: 메인 대시보드 -->
        <main id="tab-main" class="tab-content active">
          <!-- 상단 KPI 현황 -->
          <div class="kpi-grid">
            <div class="kpi-card"><h3>TOTAL REVENUE</h3><p id="kpi-rev">-</p></div>
            <div class="kpi-card"><h3>PROFIT</h3><p id="kpi-profit" class="highlight-text">-</p></div>
            <div class="kpi-card"><h3>MARGIN RATE</h3><p id="kpi-margin">-</p></div>
            <div class="kpi-card"><h3>YoY GROWTH</h3><p id="kpi-yoy">-</p></div>
            <div class="kpi-card"><h3>EXISTING BIZ</h3><p id="kpi-exist">-</p></div>
            <div class="kpi-card"><h3>NEW BIZ</h3><p id="kpi-new">-</p></div>
          </div>
          
          <!-- 차트 영역 -->
          <div class="chart-layout">
            <div class="chart-box large-chart">
              <div class="box-header">
                <h4>MONTHLY EARNING</h4>
                <span class="subtitle">월별 매출 및 손익 추이</span>
              </div>
              <canvas id="chart-monthly-trend"></canvas>
            </div>
            
            <div class="chart-box small-chart">
              <div class="box-header">
                <h4>BUSINESS SHARE</h4>
                <span class="subtitle">신규/기존 매출 비중</span>
              </div>
              <canvas id="chart-new-exist"></canvas>
            </div>
            
            <div class="chart-box half-chart">
              <div class="box-header">
                <h4>HQ PERFORMANCE</h4>
                <span class="subtitle">본부별 매출 비중</span>
              </div>
              <canvas id="chart-hq-share"></canvas>
            </div>
            
            <div class="chart-box half-chart">
              <div class="box-header">
                <h4>TEAM RANKING</h4>
                <span class="subtitle">상위 10개 팀 실적</span>
              </div>
              <canvas id="chart-team-comp"></canvas>
            </div>
          </div>
        </main>

        <!-- 탭 2: 세부 리포트 -->
        <main id="tab-detail" class="tab-content">
          <div class="table-container">
            <div class="box-header">
              <h4>DETAILED REPORTS</h4>
              <span class="subtitle">거래처별 상세 실적표 (단위: 백만원)</span>
            </div>
            <table class="data-table" id="detail-table">
              <thead>
                <tr><th>연-월</th><th>본부</th><th>팀</th><th>화주사</th><th>거래단위</th><th>구분</th><th>매출</th><th>비용</th><th>손익</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
